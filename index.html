<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>this a rock-paper-scissor game using console.log</title>
</head>
<body>
    <div>
    <h1>This a rock-paper-scissor game</h1>
    <h2>You get a Game win every 5 round!</h2>
    <h3 id="compWinRounds">Total Computer round win :</h3>
    <h3 id="humnWinRounds">Total Human round win :</h3>
    <button id="trigger-button">Play A Round</button>
        <div id="buttons" style="display: none;">
            <h4>Pick a choice!</h4>
            <button class="choice" >rock</button>
            <button class="choice" >scissor</button>
            <button class="choice" >paper</button>
        </div>

        <p id="HumanChoice"><p>
        <p id="ComputerChoice"><p>
        <p id="result"></p>
    </div>


    <script src="game-logic.js">
    </script>
</body>
</html>
