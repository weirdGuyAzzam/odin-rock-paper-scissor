<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>this a rock-paper-scissor game using console.log</title>
</head>
<body>
    <h1>this a rock-paper-scissor game using console.log</h1>

    <script>
    let humanScore = 0
    let computerScore =  0

    playGame()

    function playGame() {

    for(i = 0;i <= 4;i++) {
        playRound(getComputerChoice(),getHumanChoice())
        console.log("Human Score : " + humanScore)
        console.log("Computer Score : " + computerScore)
      }
    }
    function playRound(com, hum){

      console.log("Computer choice : " + com)
      console.log("Human choice : " + hum)

      if(com === hum){
          console.log("Tied!")
        }else if(hum === "paper" && com === "rock"){
          console.log("You Win!, rock lost to paper!")
          humanScore += 1
        }else if(hum === "paper" && com === "scissor"){
          console.log("You Lose, paper lost to scissor !")
          computerScore += 1
        }else if(hum === "scissor" && com === "rock"){
          console.log("You Lose, scissor lost to rock !")
          computerScore += 1
        }else if(hum === "scissor" && com === "paper"){
          console.log("You Win, paper lost to scissor!")
          humanScore += 1
        }else if(hum === "rock" && com === "paper"){
          console.log("You lose, rock lost to paper !")
          computerScore += 1
        }else if(hum === "rock" && com === "scissor"){
          console.log("You Win, scissor lost to rock !")
          humanScore += 1
        }

    }



    function getHumanChoice(){
      let humanChoice = prompt("Chose between rock, paper, and scissor !")

      return humanChoice.toLowerCase()
    }

    function getComputerChoice() {
      let choice = Math.floor(Math.random() * 3)

      if(choice === 1 ){
        choice = "scissor"
      }else if(choice === 2){
        choice = "rock"
      }else if(choice === 0){
        choice = "paper"
      }

      return choice
    }

    </script>
</body>
</html>
